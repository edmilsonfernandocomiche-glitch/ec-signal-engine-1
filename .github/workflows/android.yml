name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Instalar Gradle 7.6.1
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.6.1'

    - name: Configurar e Organizar Projeto Android
      run: |
        # 1. Prepara a estrutura do Android
        rm -rf app temp_zip
        mkdir -p app/src/main/java
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable

        # 2. Extrai o ZIP
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extraindo $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_zip
        fi

        # 3. Organiza o AndroidManifest.xml
        MANIFEST_FILE=$(find temp_zip -name "AndroidManifest.xml" | head -n 1)
        if [ -n "$MANIFEST_FILE" ]; then
          cp "$MANIFEST_FILE" app/src/main/
        fi

        # 4. Copia os ficheiros Java preservando os pacotes
        find temp_zip -name "*.java" | while read file; do
          pkg=$(grep -m 1 "^package " "$file" | sed 's/package //;s/;//' | tr -d '\r')
          if [ -n "$pkg" ]; then
            pkg_path=$(echo "$pkg" | tr '.' '/')
            mkdir -p "app/src/main/java/$pkg_path"
            cp "$file" "app
