name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Instalar Gradle 8.0
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: Configurar e Organizar Projeto Android
      run: |
        # 1. Limpa compilações antigas
        rm -rf app temp_zip

        # 2. Extrai o ficheiro ZIP mantendo a estrutura original
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extraindo $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_zip
        fi

        # 3. Mover a pasta 'app' do projeto extraído para a raiz
        APP_DIR=$(find temp_zip -type d -name "app" | head -n 1)
        if [ -n "$APP_DIR" ]; then
          cp -r "$APP_DIR" ./app
        else
          echo "Estrutura padrão 'app' não encontrada, a reorganizar..."
          mkdir -p app/src/main
          cp -r temp_zip/* app/src/main/ 2>/dev/null || true
        fi

        rm -rf temp_zip

        # 4. Remover styles.xml se causar duplicados com themes.xml
        if [ -f "app/src/main/res/values/themes.xml" ] && [ -f "app/src/main/res/values/styles.xml" ]; then
          rm -f app/src/main/res/values/styles.xml
        fi

        # 5. Criar settings.gradle
        cat << 'EOF' > settings.gradle
        rootProject.name = "EC_Signal_Engine"
        include ':app'
        EOF

        # 6. Criar build.gradle da raiz (com Android Gradle Plugin 8.1.1 para suportar API 34)
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
            }
        }

        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 7. Criar app/build.gradle atualizado para SDK 34
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'

        android {
            namespace 'com.ecsignalengine.app'
            compileSdkVersion 34

            defaultConfig {
                applicationId "com.ecsignalengine.app"
                minSdkVersion 21
                targetSdkVersion 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.webkit:webkit:1.8.0'
        }
        EOF

    - name: Compilar APK com Gradle
      run: |
        gradle assembleDebug --no-daemon

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
