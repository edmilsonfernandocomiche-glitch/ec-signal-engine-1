name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Instalar Gradle 7.6.1
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.6.1'

    - name: Configurar e Organizar Projeto Android
      run: |
        # 1. Prepara a estrutura do Android
        rm -rf app temp_zip
        mkdir -p app/src/main/java
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable

        # 2. Extrai o ZIP
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extraindo $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_zip
        fi

        # 3. Organiza apenas o AndroidManifest.xml
        MANIFEST_FILE=$(find temp_zip -name "AndroidManifest.xml" | head -n 1)
        if [ -n "$MANIFEST_FILE" ]; then
          cp "$MANIFEST_FILE" app/src/main/
        fi

        # 4. Copia APENAS ficheiros Java para a pasta de codigo
        find temp_zip -name "*.java" -exec cp {} app/src/main/java/ \; 2>/dev/null || true

        # 5. Copia APENAS recursos XML para as suas respetivas pastas em res
        find temp_zip -name "activity_*.xml" -o -name "layout_*.xml" -o -name "*content*.xml" | while read file; do
          cp "$file" app/src/main/res/layout/ 2>/dev/null || true
        done

        find temp_zip -name "strings.xml" -o -name "colors.xml" -o -name "styles.xml" -o -name "themes.xml" | while read file; do
          cp "$file" app/src/main/res/values/ 2>/dev/null || true
        done

        find temp_zip -name "ic_*.xml" -o -name "*.png" | while read file; do
          cp "$file" app/src/main/res/drawable/ 2>/dev/null || true
        done

        rm -rf temp_zip

        # 6. Cria settings.gradle
        cat << 'EOF' > settings.gradle
        rootProject.name = "EC_Signal_Engine"
        include ':app'
        EOF

        # 7. Cria build.gradle raiz
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
            }
        }

        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 8. Cria app/build.gradle
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'

        android {
            namespace 'com.ecsignalengine'
            compileSdkVersion 33

            defaultConfig {
                applicationId "com.ecsignalengine"
                minSdkVersion 21
                targetSdkVersion 33
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

    - name: Compilar APK com Gradle
      run: |
        gradle assembleDebug --no-daemon

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
