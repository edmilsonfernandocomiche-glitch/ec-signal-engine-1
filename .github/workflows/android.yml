name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Permissão no Gradle
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
        elif [ -f "./EC_Signal_Engine_Android/gradlew" ]; then
          chmod +x ./EC_Signal_Engine_Android/gradlew
        fi

    - name: Compilar APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -f "./EC_Signal_Engine_Android/gradlew" ]; then
          cd EC_Signal_Engine_Android && ./gradlew assembleDebug
        fi

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
