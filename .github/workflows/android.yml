name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extrair ficheiro ZIP e organizar estrutura
      run: |
        # 1. Procura e extrai o ficheiro .zip
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extraindo $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d src_temp
        fi

        # 2. Localiza onde ficou o AndroidManifest.xml
        MANIFEST_PATH=$(find . -name "AndroidManifest.xml" | head -n 1)
        if [ -n "$MANIFEST_PATH" ]; then
          SRC_DIR=$(dirname "$MANIFEST_PATH")
          echo "Manifest encontrado em: $SRC_DIR"
          
          # Cria a estrutura padrao do Android caso nao exista
          mkdir -p app/src/main
          
          # Move os ficheiros para a estrutura correta do Android
          cp -r "$SRC_DIR"/* app/src/main/ 2>/dev/null || true
        fi

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Instalar Gradle Wrapper e Compilar APK
      run: |
        # Gera o gradle wrapper
        gradle wrapper
        chmod +x gradlew
        
        # Compila o APK Debug
        ./gradlew assembleDebug --stacktrace

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
