name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar e Organizar Projeto Android
      run: |
        # 1. Extrai o ZIP caso exista
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extraindo $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d root_extracted
        fi

        # 2. Garante a estrutura de pastas app/src/main
        mkdir -p app/src/main/java
        mkdir -p app/src/main/res

        # Copia ficheiros Java e Manifest
        find . -name "AndroidManifest.xml" -exec cp {} app/src/main/ \;
        find . -name "*.java" -exec cp {} app/src/main/java/ \; 2>/dev/null || true

        # Copia recursos
        find . -name "colors.xml" -o -name "strings.xml" -o -name "styles.xml" -o -name "themes.xml" -o -name "ic_launcher.xml" | while read file; do
          dir_name=$(basename $(dirname "$file"))
          mkdir -p "app/src/main/res/$dir_name"
          cp "$file" "app/src/main/res/$dir_name/"
        done

        # 3. Cria settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "EC_Signal_Engine"
        include ':app'
        EOF

        # 4. Cria build.gradle raiz
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
            }
        }
        EOF

        # 5. Cria app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.ecsignalengine'
            compileSdk 33

            defaultConfig {
                applicationId "com.ecsignalengine"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

    - name: Compilar APK com Gradle
      run: |
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
