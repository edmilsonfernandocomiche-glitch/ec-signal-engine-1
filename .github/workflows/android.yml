name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Instalar Gradle 7.6.1
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.6.1'

    - name: Configurar e Organizar Projeto Android
      run: |
        # 1. Limpa compilações anteriores
        rm -rf app
        mkdir -p app/src/main

        # 2. Extrai o ZIP diretamente para a estrutura do projeto
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extraindo $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_zip
          
          # Mover o conteúdo extraído sem duplicar ficheiros
          if [ -d "temp_zip/app/src/main" ]; then
            cp -r temp_zip/app/src/main/* app/src/main/
          elif [ -d "temp_zip/src/main" ]; then
            cp -r temp_zip/src/main/* app/src/main/
          else
            cp -r temp_zip/* app/src/main/ 2>/dev/null || true
          fi
          rm -rf temp_zip
        fi

        # 3. Cria settings.gradle
        cat << 'EOF' > settings.gradle
        rootProject.name = "EC_Signal_Engine"
        include ':app'
        EOF

        # 4. Cria build.gradle raiz
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
            }
        }

        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 5. Cria app/build.gradle
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'

        android {
            namespace 'com.ecsignalengine'
            compileSdkVersion 33

            defaultConfig {
                applicationId "com.ecsignalengine"
                minSdkVersion 21
                targetSdkVersion 33
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

    - name: Compilar APK com Gradle
      run: |
        gradle assembleDebug --no-daemon

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
