name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extrair ficheiro ZIP do projeto
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extraindo $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d extracted_project
        else
          echo "Nenhum ficheiro ZIP encontrado!"
        fi

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Dar permissão e Compilar APK
      run: |
        GRADLE_DIR=$(find . -name "gradlew" -exec dirname {} \;)
        if [ -n "$GRADLE_DIR" ]; then
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Ficheiro gradlew não encontrado dentro do ZIP."
          exit 1
        fi

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
